<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>shikigami</title>
    <link rel="stylesheet" href="/src/styles.css" />
    <script type="module" src="/src/main.ts" defer></script>
  </head>
  <!-- ContextMenuRouting: document-level contextmenu always preventDefault via menu.ts handle; only orb hit (48px) opens radial; drag-region on body/toast does not fire on rightclick per tauri behavior -->
  <!-- #orb has NO drag-region: main.ts routes left mousedown — double-click (detail===2) = talk, single press+hold = immediate startDragging() (skipped while the menu is open). Cmd+Ctrl+M push-to-talk still works too. -->
  <body data-tauri-drag-region>
    <canvas id="orb"></canvas>
    <!-- 外圈：DOM 順序即由 orb 往外的堆疊順序（確認框最貼身 → 報告 → 名牌）。
         隱藏的 slot 靠 display:none 塌陷，所以三者可以同時在場而不互相推擠。
         方向由 toast.ts 的 orient() 掛在容器上，見 DESIGN.md §2.1–§2.2。 -->
    <div id="aura">
      <div id="confirm-bar"></div>
      <div id="toast" data-tauri-drag-region></div>
      <div id="roster-label"></div>
    </div>
  </body>
</html>
