name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so the review can diff against the base

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # We deliberately do NOT use the code-review plugin: its multi-subagent
          # orchestration launches the eligibility check as a background Task and
          # then ends the session waiting for a notification the headless action
          # never delivers, so the review stalls at step 1 (seen in show_full_output:
          # result = "I'll wait for the background agent..."). A plain prompt runs
          # the review inline — the same mechanism the @claude on-demand workflow
          # uses successfully. pull-requests: write is required so the post isn't
          # a silently-swallowed 403 (#1121).
          prompt: |
            Review pull request ${{ github.repository }}/pull/${{ github.event.pull_request.number }}.
            Fetch the diff with `gh pr diff` and read the changed files. Focus on
            correctness bugs, security, and logic/gesture races in the changed code
            only — high signal, no style nits. Then post exactly one summary comment
            on the PR with `gh pr comment`, listing any issues found (file:line +
            why), or stating there are no blocking issues if the diff is clean.
          # Plain prompt mode does NOT auto-allow Bash, so gh calls are denied and
          # the review can't even fetch the diff (result: "gh commands are being
          # blocked"). Grant just the gh verbs it needs; Read/Grep/Task are already
          # in the base tool set, so this adds to them rather than replacing.
          claude_args: |
            --allowedTools "Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr comment:*)"
          show_full_output: true # keep the review text in the Actions log for audit
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md

