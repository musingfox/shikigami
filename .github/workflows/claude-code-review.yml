name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so the review can diff against the base

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          # Config notes (all sourced from open claude-code-action issues):
          # - pull-requests: write above — the installer template ships `read`,
          #   which silently swallows the post 403 (#1121).
          # - `--comment` nudges the session to actually post; without it a
          #   review with findings can end on TodoWrite and post nothing (#1087).
          # - NO claude_args --allowedTools: base tools are GitHub-only, so
          #   listing tools there starves the review's Read/Grep/Task subagents.
          # - permission_denials_count is benign sandbox probing, not the blocker.
          # - A clean PR (no high-signal issue) stays silent by design (#1054);
          #   the command also self-skips a PR Claude has already commented on.
          prompt: '/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          show_full_output: true # keep the review text in the Actions log for audit
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md

